<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<title>Dynamic Island untuk Windows</title>
<style>
:root{--dot:"Plus Jakarta Sans","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--ink:#f4f6fb;--dim:#9aa3b8;--glass:rgba(14,20,40,.55);--line:rgba(255,255,255,.12);--sp:cubic-bezier(.34,1.4,.52,1);--acc:#ff7a59;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:var(--dot);color:var(--ink);overflow:hidden;
background:radial-gradient(1100px 650px at 15% 115%,#1f74d6 0,transparent 60%),radial-gradient(900px 600px at 88% -10%,#7d3bd6 0,transparent 55%),radial-gradient(700px 500px at 60% 60%,#0f7f8f55 0,transparent 70%),#0a1230}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:1em;height:1em;fill:currentColor;display:block}

/* island */
.isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000;overflow:hidden;cursor:pointer;
box-shadow:0 0 0 1px rgba(255,255,255,.08),0 14px 36px -10px rgba(0,0,0,.7);
transition:width .62s var(--sp),height .62s var(--sp),border-radius .62s var(--sp),top .62s var(--sp);outline:none;z-index:5}
.isl:focus-visible{box-shadow:0 0 0 2px #fff,0 14px 36px -10px rgba(0,0,0,.7)}
.v{position:absolute;left:50%;top:50%;translate:-50% -50%;display:flex;align-items:center;opacity:0;filter:blur(7px);scale:.9;
pointer-events:none;transition:opacity .22s,filter .22s,scale .45s var(--sp)}
.v.on{opacity:1;filter:none;scale:1;pointer-events:auto;transition-delay:.12s}
.bump{animation:bump .4s var(--sp)}
@keyframes bump{40%{scale:1.08 .94}}

.clock{justify-content:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;padding:0 14px}
.mc{padding:0 12px;justify-content:space-between;gap:10px}
.mc .tt{font-size:12px;font-variant-numeric:tabular-nums;color:var(--dim)}
.cov{flex:none;border-radius:8px;width:24px;height:24px;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative;overflow:hidden}
.cov::after{content:"";position:absolute;width:140%;height:70%;left:-20%;top:-25%;background:rgba(255,255,255,.28);border-radius:50%;filter:blur(6px)}
.bars{display:flex;gap:3px;align-items:center;height:16px}
.bars i{width:3px;height:4px;border-radius:2px;background:var(--acc);transition:height .2s}
.bars.on i{animation:eq .9s ease-in-out infinite}
.bars.on i:nth-child(2){animation-delay:-.3s}.bars.on i:nth-child(3){animation-delay:-.6s}.bars.on i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}

.mx{flex-direction:column;align-items:stretch;justify-content:center;padding:16px 20px;gap:12px}
.mx .top{display:flex;align-items:center;gap:14px}
.mx .cov{width:64px;height:64px;border-radius:16px}
.mx .meta{flex:1;min-width:0}
.mx .meta b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx .meta span{font-size:13px;color:var(--dim)}
.prog{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18);cursor:pointer;position:relative}
.bar::before{content:"";position:absolute;inset:-8px 0}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:#fff}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px}
.ctl button{font-size:22px;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;transition:scale .15s,background .15s}
.ctl button:hover{background:rgba(255,255,255,.12)}.ctl button:active{scale:.88}
.ctl .pp{font-size:28px;width:46px;height:46px;background:#fff;color:#000}.ctl .pp:hover{background:#e4e8f2}

.tm{justify-content:space-between;padding:0 18px 0 22px}
.tm .big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tm small{display:block;font-size:11px;color:var(--dim);margin-top:-2px}
.rb{display:flex;gap:10px}
.rb button{width:42px;height:42px;border-radius:50%;font-size:20px;display:grid;place-items:center;background:rgba(255,255,255,.14);transition:scale .15s}
.rb button:active{scale:.88}.rb .go{background:#ffb02e;color:#000}.rb .st{background:#ff4f5e;color:#fff}

.nt{padding:0 18px;gap:14px;justify-content:flex-start}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--c1)}
.nt div{min-width:0}.nt b{display:block;font-size:14px}.nt span{font-size:13px;color:#cdd3e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.bt{padding:0 18px;gap:12px;justify-content:flex-start;font-size:13px}
.bt svg{font-size:20px;color:#3ddc84}
.bt .bar{cursor:default;flex:1}.bt .bar i{background:#3ddc84}
.vl{padding:0 18px;gap:12px;font-size:13px;font-variant-numeric:tabular-nums}
.vl svg{font-size:20px}.vl .bar{flex:1;cursor:default}

.mn{justify-content:space-around;padding:0 18px;gap:14px}
.mn button{width:46px;height:46px;border-radius:50%;font-size:21px;display:grid;place-items:center;background:rgba(255,255,255,.12);transition:scale .15s,background .15s}
.mn button:hover{background:rgba(255,255,255,.24)}.mn button:active{scale:.88}
.mn button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.mx .mb{flex:none;width:34px;height:34px;border-radius:50%;font-size:17px;display:grid;place-items:center;background:rgba(255,255,255,.12);transition:scale .15s,background .15s}
.mx .mb:hover{background:rgba(255,255,255,.24)}.mx .mb:active{scale:.88}
.mn{display:grid;grid-template-columns:repeat(5,1fr);align-content:center;justify-items:center;justify-content:stretch;gap:10px 6px;padding:0 18px}
.pn{flex-direction:column;align-items:stretch;justify-content:center;padding:14px 18px;gap:10px}
.hd{display:flex;align-items:center;gap:10px;font-size:14px}.hd b{flex:1}.hd span{color:var(--dim);font-size:12px}
.pn .mb{flex:none;width:30px;height:30px;border-radius:50%;font-size:15px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.pn .mb:hover{background:rgba(255,255,255,.24)}
.add,.row{display:flex;gap:8px}
.pn input{flex:1;min-width:0;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;padding:0 12px;font:inherit;font-size:14px;color-scheme:dark}
.pn input:focus-visible{outline:2px solid #fff;outline-offset:1px}
.pn .go,.add button{height:36px;border-radius:12px;background:#ffb02e;color:#000;font-weight:600;font-size:14px}
.pn .go{padding:0 16px}.add button{width:36px;font-size:18px;display:grid;place-items:center}
.pn small{color:var(--dim);font-size:12px}
#tkl{max-height:112px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ti{display:flex;align-items:center}
.tg{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;font-size:14px;padding:5px 4px;border-radius:8px}
.tg:hover{background:rgba(255,255,255,.08)}
.ck{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #7d869b;display:grid;place-items:center;font-size:11px;color:#000}
.ti.d .ck{background:#3ddc84;border-color:#3ddc84}.ti.d .tx{text-decoration:line-through;color:var(--dim)}
.tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xd{width:26px;height:26px;border-radius:50%;color:var(--dim);font-size:16px}.xd:hover{background:rgba(255,255,255,.12)}
#chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.chip{display:flex;align-items:center;gap:8px;max-width:150px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.12);font-size:12px;cursor:grab}
.chip b{font-size:10px;padding:2px 5px;border-radius:5px;background:var(--acc);color:#000}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em{width:100%;text-align:center;color:var(--dim);font-size:13px;padding:12px 0}
.dots{display:flex;gap:4px;margin-left:8px}.dots i{width:8px;height:8px;border-radius:50%}
.fnm{max-width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc{justify-content:center;gap:14px}
.eye{width:15px;height:20px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:blink 4.6s infinite;transition:scale .25s var(--sp)}
.eye:nth-child(2){animation-delay:.04s}
.eye i{width:7px;height:9px;border-radius:50%;background:#000;transform:translate(var(--px,0),var(--py,0));transition:transform .14s}
.isl:hover .eye{scale:1.12}
@keyframes blink{0%,91%,100%{scale:1}95%{scale:1 .1}}
#pll{max-height:178px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.pi{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;text-align:left}
.pi:hover{background:rgba(255,255,255,.08)}.pi.on{background:rgba(255,255,255,.14)}
.pi .cov{width:34px;height:34px;border-radius:9px}
.pt{flex:1;min-width:0}.pt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt small{font-size:12px}
.pd{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.face{width:96px;height:40px;overflow:visible;transition:scale .25s var(--sp)}
.isl:hover .face{scale:1.07}
.face path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.face .bl{fill:#ff7a8a;opacity:.5}
.face .op{transform-box:fill-box;transform-origin:center;transition:transform .25s var(--sp),opacity .15s;animation:blink 4.6s infinite}
.face .r .op{animation-delay:.03s}
.face .pp{transform:translate(var(--px,0),var(--py,0));transition:transform .14s}
.face .ar{display:none;stroke-width:2.8}
.face .m{display:none}
.face .mh{fill:#ff8a9a;stroke:#ff8a9a;stroke-width:1.5;stroke-linejoin:round}
.face .mo{fill:#ff8a9a;stroke:none}
.face[data-e=n] .mn,.face[data-e=w] .mn,.face[data-e=h] .mh,.face[data-e=o] .mo,.face[data-e=s] .ms{display:block}
.face[data-e=h] .op,.face[data-e=w] .r .op{opacity:0;animation:none}
.face[data-e=h] .ar,.face[data-e=w] .r .ar{display:block}
.face[data-e=o] .op{transform:scale(1.18);animation:none}
.face[data-e=s] .op{transform:scaleY(.4);animation:none}
.face .fg{fill:var(--fc,#fff);transform-box:fill-box;transform-origin:center}
.face .fg.nb{animation:none}
.face .fo{transform-box:fill-box;transform-origin:center;transform:translate(var(--px,0),var(--py,0));transition:transform .14s;animation:pop .4s var(--sp)}
.face .fg .s{fill:none;stroke:var(--fc,#fff);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s}
.face .fg .f{fill:var(--fc,#fff);stroke:none;transition:fill .35s}
@keyframes pop{0%{scale:.3;rotate:-14deg;opacity:0}60%{scale:1.15;rotate:5deg;opacity:1}100%{scale:1;rotate:0}}
.mx{background:radial-gradient(130% 120% at 12% 0%,color-mix(in srgb,var(--acc) 42%,transparent),transparent 68%)}
.cg{justify-content:flex-start;padding:0 22px;gap:16px}
.cg b{display:block;font-size:17px}.cg small{color:var(--dim);font-size:12px}
.rgw{position:relative;width:60px;height:60px;flex:none;display:grid;place-items:center}
.rgw svg.r{position:absolute;inset:0;width:100%;height:100%;rotate:-90deg}
.rgw>span svg{font-size:22px;color:#3ddc84}
.rg0,.rg{fill:none;stroke-width:4}.rg0{stroke:rgba(255,255,255,.14)}
.rg{stroke:#3ddc84;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1) .2s}
.cg.on .rg{stroke-dashoffset:var(--off,38)}
.mn{grid-template-columns:repeat(6,1fr);gap:12px 6px;padding:0 20px}
.mn button{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--a),var(--b));color:#fff;box-shadow:0 6px 14px -6px var(--a),inset 0 1px 0 rgba(255,255,255,.35);transition:scale .2s var(--sp),rotate .2s var(--sp),filter .2s}
.mn button:hover{scale:1.12;rotate:-4deg;filter:brightness(1.12)}.mn button:active{scale:.9}
.mn button.act{outline:2px solid #fff;outline-offset:2px}
.mn button:nth-child(1){--a:#ff5f6d;--b:#ff9966}.mn button:nth-child(2){--a:#ffb02e;--b:#ff7a18}.mn button:nth-child(3){--a:#8e6bff;--b:#5b8def}
.mn button:nth-child(4){--a:#3ddc84;--b:#10b981}.mn button:nth-child(5){--a:#2dd4bf;--b:#3b82f6}.mn button:nth-child(6){--a:#f472b6;--b:#c026d3}
.mn button:nth-child(7){--a:#fbbf24;--b:#f59e0b}.mn button:nth-child(8){--a:#60a5fa;--b:#6366f1}.mn button:nth-child(9){--a:#34d399;--b:#0ea5e9}
.mn button:nth-child(10){--a:#fb7185;--b:#f97316}.mn button:nth-child(11){--a:#a78bfa;--b:#ec4899}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}
.isl::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:0;transition:opacity .4s;animation:spin 3s linear infinite;
background:conic-gradient(from var(--ang),transparent 0 50%,var(--acc),#fff 80%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.isl[data-s=mx]::after,.isl[data-s=mc]::after,.isl[data-s=tm]::after{opacity:.95}
.mx .cov{box-shadow:0 10px 26px -6px color-mix(in srgb,var(--c1) 75%,transparent)}
.isl[data-p="1"] .mx .cov,.isl[data-p="1"] .mc .cov{animation:brt 2.2s ease-in-out infinite}
@keyframes brt{50%{scale:1.07;rotate:2deg}}
.ti.d .ck{animation:pop2 .35s var(--sp)}@keyframes pop2{0%{scale:.4}}
.v.fc.on{animation:hop .7s var(--sp)}@keyframes hop{0%{scale:.55;rotate:-10deg}55%{scale:1.1;rotate:4deg}100%{scale:1;rotate:0}}
.face .fg *{transform-box:fill-box;transform-origin:center}
.face .fg.happy path{animation:bn .42s ease-in-out infinite alternate}
.face .fg.sq rect{animation:bn 1.1s ease-in-out infinite alternate,blink 4.6s infinite}
.face .fg.rect rect{animation:lk 3.2s ease-in-out infinite,blink 4.6s infinite}
.face .fg.angry path,.face .fg.shock ellipse{animation:sk .3s linear infinite}
.face .fg.xx path,.face .fg.pinch path{animation:sk .45s linear infinite}
.face .fg.sleep path,.face .fg.zzz path,.face .fg.sad rect{animation:br 2.4s ease-in-out infinite}
.face .fg.bay circle,.face .fg.love .hh{animation:pl .7s ease-in-out infinite}
.face .fg.coffee path:nth-child(3),.face .fg .zz{animation:fl 1.8s linear infinite}
.face .fg.coffee text{animation:bn .7s ease-in-out infinite alternate}
.face .fg .zz{font-weight:700}
@keyframes bn{to{translate:0 -3.5px}}
@keyframes lk{15%,40%{translate:-3.5px 0}55%,80%{translate:3.5px 0}}
@keyframes sk{25%{rotate:-7deg}75%{rotate:7deg}}
@keyframes br{50%{translate:0 2px;scale:1.06 1}}
@keyframes pl{50%{scale:1.25}}
@keyframes fl{0%{translate:0 5px;opacity:0}30%{opacity:1}100%{translate:3px -9px;opacity:0}}
body::before,body::after{content:"";position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;animation:fl2 18s ease-in-out infinite alternate}
body::before{background:#2fd0c0;left:-15vmax;top:30vh}body::after{background:#d63b8e;right:-18vmax;top:-12vh;animation-delay:-9s}
@keyframes fl2{to{translate:8vmax -6vmax;scale:1.15}}
.hi{flex:none;width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,var(--a),var(--b));display:grid;place-items:center;font-size:16px;font-style:normal;color:#fff;box-shadow:0 4px 10px -4px var(--a),inset 0 1px 0 rgba(255,255,255,.35)}
.tk{background:radial-gradient(120% 90% at 0% 0%,rgba(45,212,191,.2),transparent 60%)}
.al{background:radial-gradient(120% 90% at 0% 0%,rgba(244,114,182,.22),transparent 60%)}
.sh{background:radial-gradient(120% 90% at 0% 0%,rgba(251,191,36,.2),transparent 60%)}
.pl{background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 60%)}
.al input[type=time]{font-size:22px;font-weight:600;height:46px;text-align:center}.al .go{height:46px}
.tm .big{background:linear-gradient(90deg,#fff,#ffcf8a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tpb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.1)}
.tpb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffb02e,#ff5f6d);transition:width .25s linear}
.nt{background:linear-gradient(90deg,color-mix(in srgb,var(--nc,#555) 32%,transparent),transparent 72%)}
.av{background:linear-gradient(145deg,var(--c1),color-mix(in srgb,var(--c1) 55%,#000));box-shadow:0 0 18px -2px var(--c1)}
.mn{gap:24px 6px}.mn button{position:relative}
.mn button::after{content:attr(data-l);position:absolute;top:calc(100% + 4px);left:50%;translate:-50% 0;font-size:10px;color:var(--dim);white-space:nowrap;pointer-events:none}
:root{--sp:cubic-bezier(.32,1.22,.5,1)}
.isl{will-change:width,height,top;contain:layout;transition:width .5s var(--sp),height .5s var(--sp),border-radius .5s var(--sp),top .5s var(--sp)}
.isl::after,body::before,body::after{display:none}
.v{filter:none;visibility:hidden;transition:opacity .18s,scale .4s var(--sp),visibility 0s .2s}
.v.on{filter:none;visibility:visible;transition-delay:.05s,.05s,0s}
.tk,.al,.sh,.pl,.nt{background:none}
.av{background:var(--c1);box-shadow:none}
.hi{width:auto;height:auto;border-radius:0;background:none;box-shadow:none;color:var(--a);font-size:19px}
.hd b{font-family:var(--dot);font-weight:400;font-size:15px;letter-spacing:.04em}
.clock{font:400 15px var(--dot);letter-spacing:.06em}
.tm .big{background:none;color:#fff;font:400 32px/1 var(--dot)}
.al input[type=time]{font-family:var(--dot);font-weight:400;font-size:24px}
.mn button{background:linear-gradient(145deg,var(--a),var(--b));color:#fff;border-radius:15px;box-shadow:0 6px 14px -6px var(--a),inset 0 1px 0 rgba(255,255,255,.35)}
.mn button:hover{scale:1.12;rotate:-4deg;filter:brightness(1.12);background:linear-gradient(145deg,var(--a),var(--b))}
.mn button.act{outline:2px solid #fff;outline-offset:2px}
.mn button::after{font:10px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--dim);letter-spacing:0}
.trw{display:flex;align-items:center;justify-content:space-between}
.trw>button{width:46px;height:46px;border-radius:50%;background:#1c1c20;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:20px;display:grid;place-items:center;transition:scale .15s,background .15s}
.trw>button:hover{background:#2a2a30}.trw>button:active{scale:.9}
.trd{text-align:center}.trd span{font:400 46px/1 var(--dot);letter-spacing:.03em}.trd small{display:block;margin-top:6px}
.chips2{display:flex;gap:8px}
.chips2 button{flex:1;height:36px;border-radius:12px;background:#1c1c20;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:14px;transition:background .15s,scale .15s}
.chips2 button:active{scale:.95}.chips2 button.on{background:#fff;color:#000}
.chips2 button.go{flex:1.7;background:#ff9f0a;color:#000;font-weight:600;box-shadow:none}
.face .fg .f,.face .fg rect,.face .fg ellipse,.face .fg circle{animation:blink 4.6s infinite;transition:fill .35s}
.face.pv{width:62px;height:26px;flex:none}
.sw{display:flex;gap:8px;justify-content:space-between}
.sw button{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:scale .15s}
.sw button:hover{scale:1.15}.sw button.on{outline:2px solid #fff;outline-offset:2px}
.row2{display:flex;gap:8px;align-items:center}
.chip3{flex:1;height:34px;border-radius:12px;background:#1c1c20;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:13px}
.chip3[data-m=rb]{background:linear-gradient(90deg,#ff4d6d,#ffb02e,#3ddc84,#2dd4ff,#7b6bff);color:#000;font-weight:600;box-shadow:none}

/* scene */
.panel{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(440px,calc(100vw - 32px));padding:24px;border-radius:20px;background:var(--glass);

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.task{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(10,16,36,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px}

function lum([r,g,b]){const f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(r)+.7152*f(g)+.0722*f(b)}
function eff(c){let a=rgb(c),k=0;while(lum(a)<.14&&k<12){a=a.map(v=>v+(255-v)*.15);k++}return'rgb('+a.slice(0,3).map(Math.round).join()+')'}
